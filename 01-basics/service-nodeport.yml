apiVersion: v1
kind: Service
metadata:
  name: nginx-service-nodeport
spec:
  type: NodePort
  selector:      # selector will match the label of the pods created by the deployment
    app: nginx
  ports:
    - port: 80          # Port on which the service will be exposed
      targetPort: 80    # Port on which the pods are listening
      nodePort: 30080   # NodePort is a port on each node that routes to the service. It must be in the range 30000-32767.